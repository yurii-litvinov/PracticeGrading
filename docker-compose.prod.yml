services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      HOST: ${HOST:?HOST is required}
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=postgres;Port=5432;Database=practice_grading;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      JwtOptions__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: practice_grading
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practice_grading"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./PracticeGrading.Data/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
      - "${POSTGRES_DATA_DIR:-./pg-data}:/var/lib/postgresql/data"
