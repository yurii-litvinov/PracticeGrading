name: Build backend image

on:
  push:
    branches:
      - feature/member-access-authentication

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/practicegrading-api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build backend image
        run: |
          docker build \
            --file PracticeGrading.API/Dockerfile \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:staging" \
            .

      - name: Push backend image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:staging"