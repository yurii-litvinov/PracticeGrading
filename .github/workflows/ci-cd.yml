name: CI and staging deployment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      HOST: localhost
      E2E_API_URL: http://localhost:5001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build backend
        run: dotnet build

      - name: Run backend tests
        run: dotnet test

      - name: Check formatting
        run: dotnet format

      - name: Start application for end-to-end tests
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Stop test containers
        if: always()
        run: docker compose -f docker-compose.yml down

  package-staging:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/member-access-authentication'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/practicegrading-api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build backend image
        run: |
          docker build \
            --file PracticeGrading.API/Dockerfile \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:staging" \
            .

      - name: Push backend image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:staging"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /practice-grading/api
        run: |
          npm ci
          npm run build

      - name: Prepare deployment artifact
        run: |
          release_dir="$RUNNER_TEMP/practicegrading-release"

          mkdir -p \
            "$release_dir/frontend" \
            "$release_dir/migrations"

          cp -a frontend/dist/. "$release_dir/frontend/"
          cp -a PracticeGrading.Data/SqlMigrations/. "$release_dir/migrations/"

          printf '%s\n' "$GITHUB_SHA" > "$release_dir/release-sha"
          printf '%s:%s\n' "$IMAGE_NAME" "$GITHUB_SHA" > "$release_dir/api-image"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: practicegrading-release-${{ github.sha }}
          path: ${{ runner.temp }}/practicegrading-release
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/member-access-authentication'
    needs: package-staging

    runs-on:
      - self-hosted
      - Linux
      - X64
      - practicegrading-staging

    timeout-minutes: 20

    concurrency:
      group: practicegrading-staging-deployment
      cancel-in-progress: false

    permissions:
      actions: read
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: practicegrading-release-${{ github.sha }}
          path: ${{ runner.temp }}/practicegrading-release

      - name: Prepare protected deployment input
        env:
          SOURCE_DIR: ${{ runner.temp }}/practicegrading-release
          INCOMING_DIR: /var/lib/practicegrading-staging/incoming
        run: |
          test -f "$SOURCE_DIR/release-sha"
          test -f "$SOURCE_DIR/api-image"
          test -f "$SOURCE_DIR/frontend/index.html"
          test -d "$SOURCE_DIR/migrations"

          find "$INCOMING_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$SOURCE_DIR/." "$INCOMING_DIR/"

      - name: Deploy staging release
        run: sudo -n /usr/local/sbin/practicegrading-deploy
